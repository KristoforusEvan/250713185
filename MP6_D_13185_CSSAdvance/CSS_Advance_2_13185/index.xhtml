<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Kegiatan</title>
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
</head>
<body>
    <div id="wadah">
        <!-- Header Judul -->
        <div class="header-kegiatan">
            <h1>Formulir Pendaftaran Kegiatan</h1>
        </div>

        <form action="" method="post" enctype="multipart/form-data">
            <!-- Tabel 1: Data Pendaftar -->
            <h3 class="sub-judul">Data Pendaftar</h3>
            <table class="tabel-kegiatan" cellspacing="0" cellpadding="0">
                <tr>
                    <td class="kolom-label">
                        <label for="namalengkap">Nama Lengkap</label>
                    </td>
                    <td class="kolom-isian">
                        <input type="text" id="namalengkap" name="namalengkap" size="30" placeholder="Klik di sini untuk menulis..." />
                    </td>
                </tr>
                <tr class="baris-selang">
                    <td class="kolom-label">
                        <label for="nim">NIM</label>
                    </td>
                    <td class="kolom-isian">
                        <input type="text" id="nim" name="nim" size="30" placeholder="Klik di sini untuk menulis..." />
                    </td>
                </tr>
                <tr>
                    <td class="kolom-label">
                        <label for="programstudi">Program Studi</label>
                    </td>
                    <td class="kolom-isian">
                        <select name="programstudi" id="programstudi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>
                <tr class="baris-selang">
                    <td class="kolom-label">
                        <span>Jenis Kelamin</span>
                    </td>
                    <td class="kolom-isian">
                        <p class="grup-pilihan">
                            <input type="radio" id="laki" name="kelamin" value="Laki" />
                            <label for="laki">Laki-laki</label>
                            <input type="radio" id="perempuan" name="kelamin" value="Perempuan" />
                            <label for="perempuan">Perempuan</label>
                        </p>
                    </td>
                </tr>
            </table>

            <!-- Tabel 2: Pilihan Kegiatan -->
            <h3 class="sub-judul">Pilihan Kegiatan</h3>
            <table class="tabel-kegiatan" cellspacing="0" cellpadding="0">
                <tr>
                    <td class="kolom-label">
                        <span>Jenis Kegiatan</span>
                    </td>
                    <td class="kolom-isian">
                        <p class="grup-pilihan">
                            <input type="radio" id="seminar" name="kegiatan" value="Seminar" />
                            <label for="seminar">Seminar</label>
                            <input type="radio" id="pelatihan" name="kegiatan" value="Pelatihan" />
                            <label for="pelatihan">Pelatihan</label>
                            <input type="radio" id="diskusi" name="kegiatan" value="Diskusi" />
                            <label for="diskusi">Diskusi</label>
                        </p>
                    </td>
                </tr>
                <tr class="baris-selang">
                    <td class="kolom-label atas">
                        <span>Bidang Minat</span>
                    </td>
                    <td class="kolom-isian">
                        <p class="grup-pilihan">
                            <input type="checkbox" id="teknologi" name="bidang" value="Teknologi" />
                            <label for="teknologi">Teknologi</label>
                        </p>
                        <p class="grup-pilihan">
                            <input type="checkbox" id="organisasi" name="bidang" value="Organisasi" />
                            <label for="organisasi">Organisasi</label>
                        </p>
                        <p class="grup-pilihan">
                            <input type="checkbox" id="karier" name="bidang" value="Karier" />
                            <label for="karier">Karier</label>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td class="kolom-label">
                        <label for="waktukegiatan">Waktu Kegiatan</label>
                    </td>
                    <td class="kolom-isian">
                        <select name="waktukegiatan" id="waktukegiatan">
                            <option>Pagi</option>
                            <option>Siang</option>
                            <option>Sore</option>
                        </select>
                    </td>
                </tr>
            </table>

            <!-- Tabel 3: Kelengkapan Pendaftaran -->
            <h3 class="sub-judul">Kelengkapan Pendaftaran</h3>
            <table class="tabel-kegiatan" cellspacing="0" cellpadding="0">
                <tr class="baris-selang">
                    <td class="kolom-label atas">
                        <label for="harapankegiatan">Harapan Mengikuti Kegiatan</label>
                    </td>
                    <td class="kolom-isian">
                        <textarea id="harapankegiatan" name="harapankegiatan" rows="8" cols="30" placeholder="Klik di sini untuk menulis..."></textarea>
                    </td>
                </tr>
                <tr class="area-unggah">
                    <td class="kolom-label">
                        <label for="buktipembayaran">Bukti Pembayaran</label>
                    </td>
                    <td class="kolom-isian">
                        <input type="file" id="buktipembayaran" name="buktipembayaran" accept="application/pdf, image/jpeg, image/png" />
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="baris-tombol">
                        <input type="submit" name="kirim" value="Kirim Pendaftaran" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
